[package]
name = "cnki-click"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "cnki-click"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
# 只做点选: 认字和找字框. 关掉 server, 运行时也不走旧版模型和滑块.
ddddocr-tract = { version = "0.1.0", default-features = false }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
