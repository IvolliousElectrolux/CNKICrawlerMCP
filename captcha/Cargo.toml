[package]
name = "cnki-click"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "cnki-click"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
ddddocr-tract = { version = "0.1.0", default-features = false }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
