name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: captcha

      - uses: actions/cache@v4
        with:
          path: captcha/model/*.onnx
          key: ddddocr-common-33b5cd35-det-6faa8ea8

      - name: Download ddddocr models
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          root = pathlib.Path("captcha/model")
          root.mkdir(parents=True, exist_ok=True)
          # 知网是依次点击文字. 只要单字识别 common.onnx 和文字框检测 common_det.onnx.
          # 不下载旧版 common_old, 也不下载滑块用的其它文件.
          rev = "90d0d9bf95d92c3d2109c8b911261b0c01c9fd71"
          files = {
              "common.onnx": "33b5cd351ee94e73a6bf8fa18c415ed8b819b3ffd342e267c30d8ad8334e34e8",
              "common_det.onnx": "6faa8ea85a8c1a634e5050c4a138fca10f30194e0d7abbe9ade1fcd423af6ed6",
          }

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=180).read()

          for name, digest in files.items():
              path = root / name
              if path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == digest:
                  print("cached", name)
                  continue
              url = f"https://github.com/86maid/ddddocr/raw/{rev}/model/{name}"
              print("download", url)
              data = fetch(url)
              got = hashlib.sha256(data).hexdigest()
              if got != digest:
                  raise SystemExit(f"hash mismatch {name}: {got}")
              path.write_bytes(data)
              print("wrote", name, len(data))
          PY

      - name: Install mingw and upx
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64 upx-ucl

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          echo "gofmt:"
          gofmt -l $(git ls-files '*.go') || true
          echo "rustfmt:"
          cargo fmt --manifest-path captcha/Cargo.toml --check || true

      - name: Build captcha helper
        working-directory: captcha
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Smoke test captcha helper
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          bin_path = "captcha/target/x86_64-unknown-linux-gnu/release/cnki-click"
          # 1x1 png. 模型能加载并回答即可, 这张图上不应该检出字.
          image = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          job = json.dumps({"image": image, "words": ["测"]}) + "\n"
          proc = subprocess.run(["timeout", "600", bin_path], input=job.encode(), capture_output=True)
          sys.stderr.write(proc.stderr.decode("utf-8", "replace"))
          text = proc.stdout.decode("utf-8", "replace")
          print(text)
          if proc.returncode != 0:
              sys.exit(proc.returncode or 1)
          lines = [ln for ln in text.splitlines() if ln.strip()]
          if len(lines) < 2 or '"ready"' not in lines[0]:
              sys.exit("helper did not become ready")
          reply = json.loads(lines[-1])
          print("reply", reply)
          if "error" not in reply and "points" not in reply:
              sys.exit("helper reply has neither points nor error")
          PY

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/CNKICrawlerMCP.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/CNKICrawlerMCP .
          upx --best --lzma dist/CNKICrawlerMCP.exe
          upx --best --lzma dist/CNKICrawlerMCP
          cp captcha/target/x86_64-pc-windows-gnu/release/cnki-click.exe dist/cnki-click.exe
          cp captcha/target/x86_64-unknown-linux-gnu/release/cnki-click dist/cnki-click
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: CNKICrawlerMCP
          path: dist/*
          if-no-files-found: error
