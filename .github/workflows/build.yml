name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: captcha

      - uses: actions/cache@v4
        with:
          path: captcha/model/*.onnx
          key: ddddocr-official-old-det-v1

      - name: Download ddddocr models
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          root = pathlib.Path("captcha/model")
          root.mkdir(parents=True, exist_ok=True)
          old_sha = "b8f2ad9cbc1f2e3922a6cb9459e30824e7e2467f3fb4fd61420640e34ea0bf68"
          det_sha = "6faa8ea85a8c1a634e5050c4a138fca10f30194e0d7abbe9ade1fcd423af6ed6"

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=180).read()

          def fresh(name, digest):
              path = root / name
              if path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == digest:
                  print("cached", name)
                  return False
              return True

          def save(name, data, digest):
              got = hashlib.sha256(data).hexdigest()
              if got != digest:
                  raise SystemExit(f"hash mismatch {name}: {got}")
              (root / name).write_bytes(data)
              print("wrote", name, len(data))

          if fresh("common_old.onnx", old_sha):
              save("common_old.onnx", fetch("https://github.com/sml2h3/ddddocr/raw/master/ddddocr/common_old.onnx"), old_sha)
          if fresh("common_det.onnx", det_sha):
              meta = json.loads(fetch("https://pypi.org/pypi/ddddocr/1.4.11/json"))
              wheel_url = next(u["url"] for u in meta["urls"] if u["packagetype"] == "bdist_wheel")
              print("download", wheel_url)
              blob = zipfile.ZipFile(io.BytesIO(fetch(wheel_url))).read("ddddocr/common_det.onnx")
              save("common_det.onnx", blob, det_sha)
          PY

      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then
            echo "gofmt would change:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt ok"
          cargo fmt --manifest-path captcha/Cargo.toml --check
          echo "rustfmt ok"

      - name: Build captcha helper
        working-directory: captcha
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Smoke test captcha helper
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          bin_path = "captcha/target/x86_64-unknown-linux-gnu/release/cnki-click"
          # 1x1 png. 模型能加载并回答即可, 这张图上不应该检出字.
          image = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          job = json.dumps({"image": image, "words": ["测"]}) + "\n"
          proc = subprocess.run(["timeout", "360", bin_path], input=job.encode(), capture_output=True)
          sys.stderr.write(proc.stderr.decode("utf-8", "replace"))
          text = proc.stdout.decode("utf-8", "replace")
          print(text)
          if proc.returncode != 0:
              sys.exit(proc.returncode or 1)
          lines = [ln for ln in text.splitlines() if ln.strip()]
          if len(lines) < 2 or '"ready"' not in lines[0]:
              sys.exit("helper did not become ready")
          reply = json.loads(lines[-1])
          print("reply", reply)
          if "error" not in reply and "points" not in reply:
              sys.exit("helper reply has neither points nor error")
          PY

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/CNKICrawlerMCP.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/CNKICrawlerMCP .
          cp captcha/target/x86_64-pc-windows-gnu/release/cnki-click.exe dist/cnki-click.exe
          cp captcha/target/x86_64-unknown-linux-gnu/release/cnki-click dist/cnki-click

      - uses: actions/upload-artifact@v4
        with:
          name: CNKICrawlerMCP
          path: dist/*
          if-no-files-found: error
